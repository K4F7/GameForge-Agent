<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>GameForge Agent</title>
    <style>
      html, body, #game { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #111827; }
      canvas { display: block; margin: auto; }
      #game[data-state="loading"]::before { content: "Loading GameForge…"; color: #e2e8f0; font: 600 18px system-ui; position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%); }
      #game[data-state="failed"] { color: #fca5a5; display: grid; place-items: center; font: 600 16px system-ui; }
    </style>
  </head>
  <body>
    <main id="game" aria-label="GameForge Agent game preview"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
