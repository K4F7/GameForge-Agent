[package]
name = "gameforge-desktop"
version = "0.1.0"
description = "Minimal Tauri shell for the GameForge Workbench"
authors = ["sein."]
edition = "2021"
license = "MIT"

[lib]
name = "gameforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
