name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    name: Classify PR
    runs-on: windows-latest
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
    steps:
      - name: Classify changed files
        id: changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("docs-only", "false");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const isOrdinaryDocumentation = (path) => {
              if (path === "AGENTS.md" || path.endsWith("/AGENTS.md") || path.startsWith(".github/") || path.startsWith(".codeartsdoer/skills/") || path.startsWith(".codeartsdoer/agents/")) {
                return false;
              }
              return path.endsWith(".md");
            };
            core.setOutput("docs-only", String(files.length > 0 && files.every((file) => isOrdinaryDocumentation(file.filename))));

  bun:
    needs: classify
    if: ${{ needs.classify.outputs.docs-only != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        if: ${{ hashFiles('bun.lock') != '' }}
        with:
          bun-version: 1.3.14
      - name: Verify with Bun
        if: ${{ hashFiles('bun.lock') != '' }}
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test
          bun run build
          bun run bundle:check
      - name: Verify npm baseline
        if: ${{ hashFiles('bun.lock') == '' }}
        run: |
          npm ci
          npm run check
          npm run test
          npm run build
          npm run bundle:check --if-present

  pr-gate:
    name: PR Gate
    if: ${{ always() }}
    needs: [classify, bun]
    runs-on: windows-latest
    steps:
      - name: Verify required CI result
        shell: pwsh
        run: |
          if ("${{ needs.classify.result }}" -ne "success") {
            Write-Error "PR classification failed."
            exit 1
          }
          if ("${{ needs.classify.outputs.docs-only }}" -eq "true") {
            Write-Output "Ordinary documentation-only PR: full Bun CI is not required."
            exit 0
          }
          if ("${{ needs.bun.result }}" -ne "success") {
            Write-Error "Windows Bun CI did not pass."
            exit 1
          }
