name: GameForge Auto Merge Gate

on:
  workflow_run:
    workflows: [CI, GameForge PR Reviewer]
    types: [completed]

# Runs for one head SHA are serialized, never cancelled. Only the CI-triggered
# run may rerun the reviewer (see the `run.name === "CI"` guard below), so
# cancelling it when the reviewer's own completion arrives seconds later leaves
# the pull request with no path back to an approval.
concurrency:
  group: gameforge-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  checks: read
  issues: read
  pull-requests: write

jobs:
  enable:
    if: >-
      ${{
        vars.GAMEFORGE_PR_AUTOMATION_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Verify gates and enable squash auto-merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const candidates = run.pull_requests ?? [];
            if (candidates.length !== 1) {
              core.notice("Expected one associated pull request, found " + candidates.length + "; skipping.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = candidates[0].number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });

            if (pr.state !== "open" || pr.draft) {
              core.notice("PR #" + pull_number + " is not an open ready-for-review pull request; skipping.");
              return;
            }
            if (pr.head.sha !== run.head_sha) {
              core.notice("PR #" + pull_number + " advanced from " + run.head_sha + " to " + pr.head.sha + "; a newer run will decide.");
              return;
            }
            if (pr.head.repo?.full_name !== owner + "/" + repo) {
              core.notice("PR #" + pull_number + " is fork-backed; automatic mutation is disabled.");
              return;
            }

            const { data: repository } = await github.rest.repos.get({ owner, repo });
            if (!repository.allow_auto_merge) {
              core.setFailed("Repository auto-merge is disabled.");
              return;
            }

            const { data: baseBranch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: pr.base.ref,
            });
            if (!baseBranch.protected) {
              core.setFailed("Base branch " + pr.base.ref + " is not protected by a branch rule or ruleset.");
              return;
            }

            const { pathToFileURL } = require("node:url");
            const gateUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/auto-merge-gate.js`).href;
            const { selectLatestReviewerRun, waitForRequiredChecks } = await import(gateUrl);
            const checkResult = await waitForRequiredChecks({
              requiredChecks: ["PR Gate"],
              maxAttempts: 4,
              delayMs: 10_000,
              listCheckRuns: () =>
                github.paginate(github.rest.checks.listForRef, {
                  owner,
                  repo,
                  ref: pr.head.sha,
                  filter: "latest",
                  per_page: 100,
                }),
              sleep: (delayMs) => new Promise((resolve) => setTimeout(resolve, delayMs)),
            });
            if (checkResult.kind !== "ready") {
              core.notice("Required checks are not successful: " + checkResult.missingChecks.join(", "));
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const reviewerMarker = "gh-aw-agentic-workflow: GameForge PR Reviewer";
            const carryForwardMarker = "gameforge-approval-carry-forward: v1";
            const isReviewerReview = (review) =>
              review.user?.login === "github-actions[bot]" && (review.body ?? "").includes(reviewerMarker);

            // dismiss_stale_reviews rewrites a dismissed review's state to DISMISSED, so the
            // original verdict only survives on the timeline event that dismissed it. Only
            // automatic stale dismissals are recovered: they carry no dismissal message,
            // whereas a deliberate dismissal (UI or API) always requires one. A verdict a
            // maintainer explicitly revoked must stay revoked.
            const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
              owner,
              repo,
              issue_number: pull_number,
              per_page: 100,
            });
            const dismissedVerdicts = new Map(
              timeline
                .filter(
                  (entry) =>
                    entry.event === "review_dismissed" &&
                    entry.dismissed_review &&
                    !entry.dismissed_review.dismissal_message,
                )
                .map((entry) => [
                  entry.dismissed_review.review_id,
                  String(entry.dismissed_review.state ?? "").toUpperCase(),
                ]),
            );
            const verdictOf = (review) =>
              review.state === "DISMISSED" ? (dismissedVerdicts.get(review.id) ?? "DISMISSED") : review.state;

            // A maintainer's manual dismissal carries a message and names the review it
            // revoked. If it revoked a gate approval (reviewer or a carried-forward one),
            // it must block a fall-back to an older anchor -- otherwise the deliberate
            // revocation is invisible to the selector below.
            const reviewById = new Map(reviews.map((review) => [review.id, review]));
            const manualGateApprovalDismissals = timeline.filter((entry) => {
              if (
                entry.event !== "review_dismissed" ||
                !entry.dismissed_review ||
                !entry.dismissed_review.dismissal_message ||
                String(entry.dismissed_review.state ?? "").toUpperCase() !== "APPROVED"
              ) {
                return false;
              }
              const dismissed = reviewById.get(entry.dismissed_review.review_id);
              const body = dismissed?.body ?? "";
              return (
                dismissed?.user?.login === "github-actions[bot]" &&
                (body.includes(reviewerMarker) || body.includes(carryForwardMarker))
              );
            });

            let hasCurrentGameForgeApproval = reviews.some(
              (review) =>
                review.user?.login === "github-actions[bot]" &&
                review.state === "APPROVED" &&
                review.commit_id === pr.head.sha &&
                ((review.body ?? "").includes(reviewerMarker) || (review.body ?? "").includes(carryForwardMarker)),
            );

            if (!hasCurrentGameForgeApproval) {
              // Only a verdict the reviewer agent itself produced may anchor a carry-forward.
              // Anchoring on a previous carry-forward would let a chain of individually-trivial
              // pushes drift the PR away from anything a reviewer actually read.
              const reviewerVerdicts = reviews.filter(
                (review) => isReviewerReview(review) && ["APPROVED", "CHANGES_REQUESTED"].includes(verdictOf(review)),
              );
              const latestVerdict = reviewerVerdicts[reviewerVerdicts.length - 1];
              const latestApproval = [...reviewerVerdicts]
                .reverse()
                .find((review) => verdictOf(review) === "APPROVED");
              const reviewedSha = latestApproval ? latestApproval.commit_id : null;
              const hasNewerChangesRequested =
                latestVerdict !== undefined && verdictOf(latestVerdict) === "CHANGES_REQUESTED";
              // Fail closed if a maintainer revoked a gate approval at or after the anchor's
              // own submission -- the deliberate revocation must outrank the older approval.
              const anchorSubmittedAt = latestApproval ? Date.parse(latestApproval.submitted_at ?? "") : NaN;
              const hasNewerManualDismissal = manualGateApprovalDismissals.some(
                (entry) => !Number.isNaN(anchorSubmittedAt) && Date.parse(entry.created_at ?? "") >= anchorSubmittedAt,
              );

              if (reviewedSha) {
                const { data: comparison } = await github.rest.repos.compareCommits({
                  owner,
                  repo,
                  base: reviewedSha,
                  head: pr.head.sha,
                });
                const { pathToFileURL } = require("node:url");
                const carryForwardUrl = pathToFileURL(
                  `${process.env.GITHUB_WORKSPACE}/.github/scripts/approval-carryforward.js`,
                ).href;
                const { decideApprovalCarryForward } = await import(carryForwardUrl);
                const carryForward = decideApprovalCarryForward({
                  reviewedSha,
                  headSha: pr.head.sha,
                  hasNewerChangesRequested,
                  hasNewerManualDismissal,
                  comparisonStatus: comparison.status,
                  changedFiles: (comparison.files ?? []).map((changed) => ({
                    filename: changed.filename,
                    status: changed.status,
                    additions: changed.additions,
                    deletions: changed.deletions,
                    previousFilename: changed.previous_filename,
                  })),
                });

                if (carryForward.kind === "carry-forward") {
                  const body = [
                    "Approval carried forward from `" + reviewedSha + "`.",
                    "",
                    "The delta since that review is " +
                      (carryForward.rule === "documentation"
                        ? "ordinary documentation only"
                        : "additive test changes only") +
                      ", and `PR Gate` passes for this head SHA. No production source, workflow, or policy file changed, so the reviewed verdict still describes this commit.",
                    "",
                    "<!-- " + carryForwardMarker + " -->",
                  ].join("\n");
                  await github.rest.pulls.createReview({
                    owner,
                    repo,
                    pull_number,
                    commit_id: pr.head.sha,
                    event: "APPROVE",
                    body,
                  });
                  core.notice(
                    "Carried the GameForge PR Reviewer approval forward to " +
                      pr.head.sha +
                      " for PR #" +
                      pull_number +
                      " (" +
                      carryForward.rule +
                      ").",
                  );
                  hasCurrentGameForgeApproval = true;
                } else {
                  core.notice("Approval carry-forward declined: " + carryForward.reason + ".");
                }
              }
            }

            if (!hasCurrentGameForgeApproval) {
              const hasCurrentGameForgeChangesRequested = reviews.some(
                (review) =>
                  review.user?.login === "github-actions[bot]" &&
                  review.state === "CHANGES_REQUESTED" &&
                  review.commit_id === pr.head.sha &&
                  (review.body ?? "").includes(reviewerMarker),
              );
              if (run.name === "CI" && !hasCurrentGameForgeChangesRequested) {
                const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                  owner,
                  repo,
                  event: "pull_request",
                  head_sha: pr.head.sha,
                  per_page: 100,
                });
                const reviewerRun = selectLatestReviewerRun(workflowRuns, pr.head.sha);
                if (reviewerRun) {
                  await github.rest.actions.reRunWorkflow({ owner, repo, run_id: reviewerRun.id });
                  core.notice("Re-ran GameForge PR Reviewer after CI passed for PR #" + pull_number + ".");
                  return;
                }
              }
              core.notice("No GameForge PR Reviewer approval exists for the current head SHA; skipping.");
              return;
            }

            const query = "query($owner: String!, $repo: String!, $number: Int!, $cursor: String) { repository(owner: $owner, name: $repo) { pullRequest(number: $number) { id headRefOid reviewDecision mergeable mergeStateStatus autoMergeRequest { enabledAt } reviewThreads(first: 100, after: $cursor) { nodes { isResolved } pageInfo { hasNextPage endCursor } } } } }";
            let cursor = null;
            let pullRequest = null;
            let unresolved = 0;
            do {
              const result = await github.graphql(query, {
                owner,
                repo,
                number: pull_number,
                cursor,
              });
              pullRequest = result.repository.pullRequest;
              unresolved += pullRequest.reviewThreads.nodes.filter((thread) => !thread.isResolved).length;
              cursor = pullRequest.reviewThreads.pageInfo.hasNextPage
                ? pullRequest.reviewThreads.pageInfo.endCursor
                : null;
            } while (cursor);

            if (pullRequest.headRefOid !== pr.head.sha) {
              core.notice("PR #" + pull_number + " changed during gate evaluation; skipping.");
              return;
            }
            if (pullRequest.reviewDecision !== "APPROVED") {
              core.notice("PR #" + pull_number + " review decision is " + (pullRequest.reviewDecision ?? "unset") + "; skipping.");
              return;
            }
            if (pullRequest.mergeable !== "MERGEABLE") {
              core.notice("PR #" + pull_number + " mergeability is " + pullRequest.mergeable + "; skipping.");
              return;
            }
            if (unresolved > 0) {
              core.notice("PR #" + pull_number + " has " + unresolved + " unresolved review thread(s); skipping.");
              return;
            }
            if (pullRequest.autoMergeRequest) {
              core.notice("PR #" + pull_number + " already has auto-merge enabled.");
              return;
            }

            const policyUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/auto-merge-policy.js`).href;
            const { decideMergeAction } = await import(policyUrl);
            const decision = decideMergeAction({
              mergeStateStatus: pullRequest.mergeStateStatus,
              mergeable: pullRequest.mergeable,
              reviewDecision: pullRequest.reviewDecision,
              unresolvedThreads: unresolved,
              hasAutoMergeRequest: Boolean(pullRequest.autoMergeRequest),
            });

            if (decision.kind === "merge-now") {
              const { data: merge } = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number,
                sha: pr.head.sha,
                merge_method: "squash",
              });
              if (!merge.merged) {
                core.setFailed("GitHub did not merge PR #" + pull_number + ": " + merge.message);
                return;
              }
              core.notice("Squash-merged clean PR #" + pull_number + " at " + pr.head.sha + ".");
              return;
            }

            if (decision.kind === "enable-auto-merge") {
              const mutation = "mutation($pullRequestId: ID!) { enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) { pullRequest { number } } }";
              await github.graphql(mutation, { pullRequestId: pullRequest.id });
              core.notice("Enabled squash auto-merge for blocked PR #" + pull_number + " at " + pr.head.sha + ".");
              return;
            }

            core.notice("PR #" + pull_number + " is not ready for a merge mutation: " + decision.reason + ".");
